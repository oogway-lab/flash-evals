name: Feature request
description: Propose a Flash Evals capability or workflow improvement.
title: "feat: "
labels:
  - type:feature
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - api
        - llm-core
        - deployment
        - docs
        - tooling
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or team problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the intended workflow, boundaries, and non-goals.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Done when
      description: Describe acceptance examples or verification.
    validations:
      required: true
