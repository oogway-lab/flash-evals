services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: mosaic
            POSTGRES_PASSWORD: mosaic
            POSTGRES_DB: mosaic
        ports:
            - "127.0.0.1:54322:5432"
        volumes:
            - mosaic-postgres:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U mosaic -d mosaic"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    mosaic-postgres:
