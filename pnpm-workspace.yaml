packages:
    - "packages/*"
    - "apps/*"
overrides:
    # Fix production audit advisories in the Next/PostCSS dependency tree.
    source-map-js: 1.2.2
    "next>sharp": 0.35.5
    # Pre-8 undici consumers (miniflare, AI SDK, dotenvx) stay on
    # the patched 7.30.1 line; llm-core depends on undici 8 directly.
    "undici@<8": 7.30.1
    # Patch compressed-body error handling in the MCP SDK's Express dependency.
    "body-parser@>=2 <2.4.0": 2.4.0
    # Patch MCP middleware, address parsing, and JSON-schema URI resolution.
    "hono@>=4 <4.13.11": 4.13.11
    "ip-address@>=10 <10.7.4": 10.7.4
    "fast-uri@>=3 <3.1.9": 3.1.9
    # Patch the new Astro dependency tree; leave the web runtime baseline alone.
    "@astrojs/internal-helpers>js-yaml": 4.3.2
    "@astrojs/internal-helpers>smol-toml": 1.9.1
allowBuilds:
    esbuild: true
    sharp: true
    unrs-resolver: true
    workerd: true
# Refuse to install when the running Node version does not satisfy
# `engines.node` in package.json (Vitest 5-supported Node ranges). Without it pnpm only warns.
engineStrict: true
# Install missing peer dependencies instead of reporting them. This is pnpm's
# default; kept explicit so the behaviour survives a default change.
autoInstallPeers: true
# No `confirmModulesPurge`: pnpm 12 removed it and refuses to install while it
# is set. pnpm 12 also recreates node_modules without prompting when there is
# no TTY, so non-interactive installs by agents and scripts do not hang.
